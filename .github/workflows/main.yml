name: Main

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test:

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '23.x'
          cache: 'npm'

      - name: Install Project
        run: npm ci

      - name: Check Version
        run: ./scripts/check_version.sh

      - name: Check Types
        run: ./scripts/check_types.sh

      - name: Build
        run: ./scripts/build.sh

      - name: Build Prod
        run: ./scripts/build.sh --prod

      - name: Test
        run: ./scripts/run_tests.sh

  site:
    needs: test
    if: ${{ github.event_name == 'push' && github.repository_owner == 'edulinq' && github.ref == 'refs/heads/main' }}

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '23.x'
          cache: 'npm'

      - name: Install Project
        run: npm ci

      - name: Build
        run: ./scripts/build.sh

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist/sample/dev'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
